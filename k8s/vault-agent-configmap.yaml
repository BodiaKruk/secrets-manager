apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config
  namespace: secrets-manager
data:
  # Vault Agent configuration for sidecar injection.
  # This is rendered as a template by the Vault Agent Injector;
  # the annotations on the Pod take precedence for path/template.
  agent-config.hcl: |
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "secrets-manager-app"
        }
      }

      sink "file" {
        config = {
          path = "/home/vault/.vault-token"
        }
      }
    }

    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }

    template_config {
      static_secret_render_interval = "5m"
      exit_on_retry_failure         = true
    }

    # Renew token automatically before expiry.
    cache {
      use_auto_auth_token = true
    }
