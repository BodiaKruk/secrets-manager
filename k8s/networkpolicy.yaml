# Deny all ingress/egress by default, then whitelist needed flows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: secrets-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow app pods to reach Vault (port 8200) in vault namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-egress
  namespace: secrets-manager
spec:
  podSelector:
    matchLabels:
      app: secrets-manager-app
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 8200
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
---
# Allow Prometheus scraping on port 9090.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ingress
  namespace: secrets-manager
spec:
  podSelector:
    matchLabels:
      app: secrets-manager-app
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 9090
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
