[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secrets-manager"
version = "0.1.0"
description = "Multi-cloud secrets manager with unified interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hvac>=2.1.0",
    "boto3>=1.34.0",
    "google-cloud-secret-manager>=2.20.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-identity>=1.16.0",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "locust>=2.28.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.12",
    "boto3-stubs[secretsmanager]>=1.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/secretsmanager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/secretsmanager --cov-report=term-missing --cov-report=html"
markers = [
    "unit: fast, no external deps",
    "integration: requires running backends",
    "load: performance tests via locust",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py310"]
